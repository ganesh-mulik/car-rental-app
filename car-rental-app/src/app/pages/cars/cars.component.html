<div class="container-fluid">
    <div class="row"> 
      <div class="col-8 text-center display-5 text-primary">
        Car Portal
      </div>
      <div class="col-4 text-center pt-2">
        <button class="btn btn-warning btn-md" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample" (click)="addNew()"> Add New</button>
      </div>
    </div>    
      <div class="row">
        @for (item of carData; track item) {
          <div class="col-3 pt-4">
            <div class="card border border-primary">
              <img
                [src]="item.carImage" height="200" />
              <div class="card-body">
                <div class="row">
                  <div class="col-6 text-start pt-1">
                    <span>{{item.brand}}</span>({{item.model}})
                  </div>
                  <div class="col-6 text-end pt-1">
                    <span> {{item.year}}</span>
                  </div>
                </div>
                <div class="row">
                  <div class="col-6 text-start pt-1">
                    <span>{{item.color}}</span>
                  </div>
                  <div class="col-6 text-end pt-1">
                    <span> ${{item.dailyRate}}</span>
                  </div>
                </div>               
                <div class="row">
                  <div class="col-6 text-start pt-1">
                    <button class="btn btn-outline-danger btn-sm" (click)="deleteCar(item.carId)">Delete</button>
                  </div>
                  <div class="col-6 text-end pt-1">
                    <button class="btn btn-outline-success btn-sm" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample" (click)="onEdit(item)">Edit</button>
                  </div>
                </div>
                
              </div>
            </div>
          </div>
        }
      </div>   
   
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasExampleLabel">Add New Car</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body" [formGroup]="carForm">
        <div class="row">
          <div class="col-6 mt-2">
            <label>Reg No</label>
            <input type="text" class="form-control" placeholder="Enter car image url" formControlName="regNo"/>
          </div>          
          <div class="col-6 mt-2">
            <label>Brand</label>
            <input type="text" class="form-control" placeholder="Enter brand name" formControlName="brand"/>
          </div>
          <div class="col-6 mt-2">
            <label>Model</label>
            <input type="text" class="form-control" placeholder="Enter model name"formControlName="model"/>
          </div>
          <div class="col-6 mt-2">
            <label>Year</label>
            <input type="text" class="form-control" placeholder="Enter year" formControlName="year"/>
          </div>
          <div class="col-6 mt-2">
            <label>Color</label>
            <input type="text" class="form-control" placeholder="Enter color" formControlName="color"/>
          </div>
          <div class="col-6 mt-2">
            <label>Daily Rate</label>
            <input type="text" class="form-control" placeholder="Enter daily rate" formControlName="dailyRate"/>
          </div>
          <div class="col-6 mt-2">
            <label>Car Image URL</label>
            <input type="text" class="form-control" placeholder="Enter car image url" formControlName="carImage"/>
          </div>
        </div>
        <div class="row">
          <div class="col-12 mt-2 text-center">
            <button class="btn btn-sm btn-secondary m-1">Reset</button>            
            @if(carForm.controls['carId'].value===0){
              <button class="btn btn-sm btn-success" (click)="saveCar()">Save Car</button>
            }
            @else {
              <button class="btn btn-sm btn-success" (click)="updateCar()">Update Car</button>
            }
          </div>
        </div>
      </div>
    </div>
